---
name: Testing

permissions:
  actions: write
  contents: read

on:
  pull_request:

jobs:
  skip-check:
    name: Run tests except on release
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578
        with:
          paths_ignore: '["releases/**"]'

  command:
    name: Command
    needs: skip-check
    if: ${{ needs.skip-check.outputs.should_skip != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        command: ['do-release', 'release']

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Test the `make ${{ matrix.command }}` command
        env:
          # Needed for testing as we're running validations which hit the GH API rate limit
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make test-${{ matrix.command }}

  entire-release:
    name: Entire release process
    needs: skip-check
    if: ${{ needs.skip-check.outputs.should_skip != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['100.0.0-m0', '100.0.0-rc0']

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # Needed to properly build multi-arch Shipyard images when branching out
      - name: Set up QEMU (to support building on non-native architectures)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
      - name: Set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Test the entire release
        env:
          # Needed for testing as we're running validations which hit the GH API rate limit
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make test-entire-release VERSION="${{ matrix.version }}"
